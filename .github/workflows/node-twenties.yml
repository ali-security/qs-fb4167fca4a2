name: 'Tests: node.js >= 20'

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'a tape glob to run instead of the whole suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [23, 22, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2025-01-14T18%3A02%3A18.697000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      # `tests-only` is `nyc tape 'test/**/*.js'`, so a filter has to REPLACE the
      # glob rather than be appended to it.
      - run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx nyc tape "${{ inputs.test-filter }}"
          else
            npm run tests-only
          fi

  pack:
    name: 'npm pack'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2025-01-14T18%3A02%3A18.697000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      # `prepack` (npmignore + `npm run dist`) is what the published tarball is
      # built from, so `npm pack` runs with scripts enabled and `dist/qs.js` is
      # regenerated by browserify exactly as the release was.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: qs-tarball
          path: qs-6.14.0.tgz
          if-no-files-found: error

  node:
    name: 'node >= 20'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: true
